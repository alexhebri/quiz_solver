<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hebri Oracle Quiz Solver</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #171a23;
        --panel-2: #1d2230;
        --text: #e6e8ef;
        --muted: #a3a9b8;
        --accent: #64d2ff;
        --accent-2: #4fb477;
        --error: #ff6b6b;
        --border: #2a3042;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        width: 340px;
      }

      .wrap {
        padding: 16px 16px 14px;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 12px;
        letter-spacing: 0.3px;
      }

      .field {
        margin-bottom: 10px;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
      }

      button {
        width: 100%;
        padding: 10px 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0b0d12;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Toggle switch */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .toggle-label {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .toggle-badge {
        font-size: 10px;
        background: var(--accent);
        color: #0b0d12;
        border-radius: 10px;
        padding: 1px 6px;
        font-weight: 700;
        min-width: 18px;
        text-align: center;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
        flex-shrink: 0;
      }

      .switch input { display: none; }

      .slider {
        position: absolute;
        inset: 0;
        background: var(--border);
        border-radius: 18px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .slider:before {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        left: 3px;
        top: 3px;
        background: var(--muted);
        border-radius: 50%;
        transition: transform 0.2s, background 0.2s;
      }

      .switch input:checked + .slider { background: var(--accent-2); }
      .switch input:checked + .slider:before {
        transform: translateX(16px);
        background: #fff;
      }

      /* Log action buttons */
      .log-actions {
        display: none;
        gap: 6px;
        margin-top: 6px;
      }

      .log-actions.visible { display: flex; }

      .log-actions button {
        flex: 1;
        padding: 7px 8px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 8px;
        border: none;
        cursor: pointer;
      }

      #exportBtn {
        background: linear-gradient(135deg, var(--accent), #4a9fc4);
        color: #0b0d12;
      }

      #clearBtn {
        background: var(--panel-2);
        color: var(--error);
        border: 1px solid var(--border);
      }

      #clearBtn:hover { background: #2a1a1a; }

      .status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        font-size: 12px;
        line-height: 1.45;
      }

      .status strong {
        color: var(--accent);
      }

      .error {
        color: var(--error);
      }

      .log {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #0c0f16;
        border: 1px dashed var(--border);
        color: var(--muted);
        font-size: 11px;
        min-height: 36px;
        white-space: pre-wrap;
      }

      .tip {
        margin-top: 10px;
        font-size: 10px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Hebri Oracle Quiz Solver</h1>

      <div class="field">
        <label for="apiKey">OpenRouter API Key</label>
        <input id="apiKey" type="password" placeholder="sk-or-..." />
      </div>

      <div class="field">
        <label for="model">Model</label>
        <input id="model" type="text" value="deepseek/deepseek-v4.1-flash-1017" />
      </div>

      <button id="solveBtn">Solve &amp; Next</button>

      <div class="toggle-row">
        <span class="toggle-label">Auto run</span>
        <label class="switch">
          <input type="checkbox" id="autoRunToggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">
          Save Q&amp;A log
          <span class="toggle-badge" id="logCount">0</span>
        </span>
        <label class="switch">
          <input type="checkbox" id="logToggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="log-actions" id="logActions">
        <button id="exportBtn">⬇ Export JSON</button>
        <button id="clearBtn">✕ Clear log</button>
      </div>

      <div class="status" id="statusArea">
        <div><strong>Question:</strong> <span id="questionPreview">-</span></div>
        <div><strong>AI Answer:</strong> <span id="aiAnswer">-</span></div>
        <div><strong>Clicked:</strong> <span id="clickedAnswer">-</span></div>
      </div>

      <div class="log" id="logArea"></div>

      <div class="tip">
        Tip: If nothing is detected, press F12, inspect the question element, and add its class to the top of the selector arrays in content.js
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
